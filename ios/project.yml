# Generate PopQuiz.xcodeproj with:  xcodegen   (brew install xcodegen)
name: PopQuiz
options:
  bundleIdPrefix: com.tweigman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PopQuizCore:
    path: Packages/PopQuizCore

settings:
  base:
    DEVELOPMENT_TEAM: 4GMRTUW6FD
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

targets:
  PopQuiz:
    type: application
    platform: iOS
    sources:
      - PopQuiz
    dependencies:
      - package: PopQuizCore
    info:
      path: PopQuiz/Info.plist
      properties:
        CFBundleDisplayName: Decades
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # A native iPad app turns with the iPad, so it offers every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: Decades listens for your answers.
        NSSpeechRecognitionUsageDescription: Decades turns your spoken answers into text, on this device.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tweigman.popquiz
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.0.2"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle game data
        script: '"$SRCROOT/scripts/bundle_game_data.sh"'
        basedOnDependencyAnalysis: false
